[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bess-ote"
version = "0.1.0"
description = "BESS OTE kalkulačka: optimal charge/discharge/wait schedule of a home battery on Czech OTE day-ahead prices, and a backtest that uses only prices published at each moment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "OOtta" }]
keywords = ["battery", "BESS", "arbitrage", "OTE", "spot price", "electricity", "Czech", "backtest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Czech",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    # zoneinfo falls back to this package when the OS has no time-zone database
    # (Windows, Termux/Android, minimal containers).
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.6"]

[project.scripts]
bess-ote = "bess_ote.cli:main"

[project.urls]
Homepage = "https://github.com/OOtta/bess-ote"
Issues = "https://github.com/OOtta/bess-ote/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bess_ote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Czech text contains look-alike characters

[tool.ruff.format]
quote-style = "double"
